name: steenie_wallet
description: An open-source, non-custodial cryptocurrency wallet.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bip39: ^1.0.6
  bip32: ^2.0.0
  bitcoin_base: ^7.3.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  http: ^1.6.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  shared_preferences: ^2.5.5
  web3dart: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
